<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🤘Party's😎BS🤪👀rideouts🍻🏍</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 10px;
      background: #141b17;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: clamp(16px, 4.5vw, 22px);
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #70e000;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      text-align: center;
      word-break: break-word;
    }
    #game-container {
      position: relative;
      border: 3px solid #38b000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      background: #2b3a4a;
      width: 100%;
      max-width: 800px;
      touch-action: manipulation;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 800 / 300;
    }
    #mute-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid #70e000;
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
    }
    .instructions {
      margin-top: 15px;
      color: #99a89c;
      font-size: 14px;
      text-align: center;
    }
    .instructions kbd {
      background: #2b3a4a;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid #4a5c6e;
      color: #fff;
    }
  </style>
</head>
<body>

  <h1>🤘Party's😎BS🤪👀rideouts🍻🏍</h1>
  <div id="game-container">
    <button id="mute-btn" title="Toggle Sound">🔊</button>
    <canvas id="gameCanvas" width="800" height="300"></canvas>
  </div>
  <p class="instructions">Press <kbd>Space</kbd>, <kbd>↑</kbd>, or <b>Tap</b> to Jump / Restart</p>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const muteBtn = document.getElementById('mute-btn');

    const GROUND_Y = 245;
    const GRAVITY = 0.65;
    const JUMP_FORCE = -13;

    let gameSpeed = 5;
    let score = 0;
    let highScore = 0;
    let gameOver = false;
    let obstacles = [];
    let clouds = [];
    let ducks = [];
    let parkedBikes = [];
    let nextObstacleTimer = 0;
    let nextParkedBikeTimer = 40;
    let riverOffset = 0;
    let grassOffset = 0;

    // --- Web Audio Rock Synthesizer Engine ---
    let audioCtx = null;
    let isMuted = false;
    let audioLoopTimer = null;
    let musicStep = 0;

    // 16-step classic heavy rock riff (frequencies in Hz: E, G, A, D, etc.)
    const bassRiff = [
      82.41, 82.41, 98.00, 82.41,  110.00, 82.41, 98.00, 82.41,
      82.41, 82.41, 146.83, 110.00, 98.00, 82.41, 73.42, 82.41
    ];
    const guitarChords = [
      [164.81, 246.94], null, [196.00, 293.66], null,
      [220.00, 329.63], null, [196.00, 293.66], null,
      [164.81, 246.94], null, [293.66, 440.00], [220.00, 329.63],
      [196.00, 293.66], null, [146.83, 220.00], null
    ];

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (!audioLoopTimer) {
        // ~135 BPM 16th note drive
        audioLoopTimer = setInterval(playRockStep, 115);
      }
    }

    function playRockStep() {
      if (!audioCtx || isMuted || gameOver) return;

      const t = audioCtx.currentTime;
      const step = musicStep % 16;

      // 1. Driving Bass Guitar (Distorted sawtooth)
      const bassFreq = bassRiff[step];
      const bassOsc = audioCtx.createOscillator();
      const bassGain = audioCtx.createGain();
      bassOsc.type = 'sawtooth';
      bassOsc.frequency.setValueAtTime(bassFreq, t);

      bassGain.gain.setValueAtTime(0.18, t);
      bassGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);

      bassOsc.connect(bassGain);
      bassGain.connect(audioCtx.destination);
      bassOsc.start(t);
      bassOsc.stop(t + 0.11);

      // 2. Rhythm Guitar Power Chords
      const chord = guitarChords[step];
      if (chord) {
        chord.forEach(freq => {
          const gOsc = audioCtx.createOscillator();
          const gGain = audioCtx.createGain();
          gOsc.type = 'square';
          gOsc.frequency.setValueAtTime(freq, t);

          gGain.gain.setValueAtTime(0.08, t);
          gGain.gain.exponentialRampToValueAtTime(0.005, t + 0.16);

          gOsc.connect(gGain);
          gGain.connect(audioCtx.destination);
          gOsc.start(t);
          gOsc.stop(t + 0.18);
        });
      }

      // 3. Drum Kit
      // Kick Drum on beats 0, 4, 8, 12 (with syncopation on 10)
      if (step % 4 === 0 || step === 10) {
        playKick(t);
      }
      // Snare Clap on backbeats 4 and 12
      if (step === 4 || step === 12) {
        playSnare(t);
      }
      // Closed Hi-Hat on every step
      playHiHat(t, step % 2 === 0);

      musicStep++;
    }

    function playKick(t) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.exponentialRampToValueAtTime(32, t + 0.1);
      gain.gain.setValueAtTime(0.35, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.11);
    }

    function playSnare(t) {
      const bufferSize = audioCtx.sampleRate * 0.1;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 900;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(t);
      noise.stop(t + 0.12);
    }

    function playHiHat(t, accent) {
      const bufferSize = audioCtx.sampleRate * 0.04;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 6500;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(accent ? 0.09 : 0.04, t);
      gain.gain.exponentialRampToValueAtTime(0.005, t + 0.04);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(t);
      noise.stop(t + 0.045);
    }

    function playJumpSound() {
      if (!audioCtx || isMuted) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.exponentialRampToValueAtTime(320, t + 0.18);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.2);
    }

    function playCrashSound() {
      if (!audioCtx || isMuted) return;
      const t = audioCtx.currentTime;
      const bufferSize = audioCtx.sampleRate * 0.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);

      noise.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(t);
      noise.stop(t + 0.5);
    }

    // Toggle mute
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    // --- Chopper Rider Object ---
    const rider = {
      x: 75,
      y: GROUND_Y,
      width: 70,
      height: 45,
      vy: 0,
      isGrounded: true,
      wheelRotation: 0,

      jump() {
        if (this.isGrounded) {
          this.vy = JUMP_FORCE;
          this.isGrounded = false;
          playJumpSound();
        }
      },

      update() {
        this.vy += GRAVITY;
        this.y += this.vy;

        if (this.y >= GROUND_Y) {
          this.y = GROUND_Y;
          this.vy = 0;
          this.isGrounded = true;
        }

        if (this.isGrounded) {
          this.wheelRotation += 0.25;
        }
      },

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (!this.isGrounded) {
          ctx.rotate(-0.08);
        }

        // Back Wheel
        this.drawWheel(0, 0, 10);

        // Front Wheel
        this.drawWheel(55, 0, 10);

        // Frame & Engine
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(20, -5);
        ctx.lineTo(25, -20);
        ctx.lineTo(10, -15);
        ctx.lineTo(0, 0);
        ctx.stroke();

        ctx.fillStyle = '#6c757d';
        ctx.fillRect(16, -14, 10, 10);

        // Fuel Tank
        ctx.fillStyle = '#d90429';
        ctx.beginPath();
        ctx.ellipse(28, -20, 10, 5, -0.2, 0, Math.PI * 2);
        ctx.fill();

        // High Bars & Extended Fork
        ctx.strokeStyle = '#dee2e6';
        ctx.beginPath();
        ctx.moveTo(55, 0);
        ctx.lineTo(34, -22);
        ctx.lineTo(31, -38);
        ctx.stroke();

        // Chrome Exhaust Pipe
        ctx.strokeStyle = '#e9ecef';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(22, -6);
        ctx.lineTo(2, -4);
        ctx.lineTo(-6, -8);
        ctx.stroke();

        // Rider
        ctx.strokeStyle = '#212529';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(14, -16);
        ctx.lineTo(20, -32);
        ctx.stroke();

        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(20, -30);
        ctx.lineTo(31, -36);
        ctx.stroke();

        // Helmet & Goggles
        ctx.fillStyle = '#343a40';
        ctx.beginPath();
        ctx.arc(22, -38, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffbe0b';
        ctx.fillRect(25, -40, 4, 3);

        ctx.restore();
      },

      drawWheel(wx, wy, radius) {
        ctx.save();
        ctx.translate(wx, wy);
        ctx.rotate(this.wheelRotation);

        ctx.fillStyle = '#1b1b1b';
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ced4da';
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ced4da';
        ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(-radius, 0);
          ctx.lineTo(radius, 0);
          ctx.rotate(Math.PI / 4);
          ctx.stroke();
        }

        ctx.restore();
      }
    };

    // --- Independent Parked Motorcycle ---
    class ParkedBike {
      constructor() {
        this.x = canvas.width + 30;
        this.y = 236;
        this.facing = Math.random() < 0.5 ? 'front' : 'rear';
        const tankColors = ['#e63946', '#fca311', '#457b9d', '#9b5de5', '#2a9d8f'];
        this.color = tankColors[Math.floor(Math.random() * tankColors.length)];
        this.lean = (Math.random() * 0.08) - 0.04;
      }

      update() {
        this.x -= gameSpeed;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.lean);

        if (this.facing === 'front') {
          // Front Tire
          ctx.fillStyle = '#111';
          ctx.fillRect(-3.5, -16, 7, 16);
          ctx.strokeStyle = '#adb5bd';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, -14);
          ctx.lineTo(0, -2);
          ctx.stroke();

          // Forks
          ctx.strokeStyle = '#ced4da';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-5, -3); ctx.lineTo(-5, -23);
          ctx.moveTo(5, -3); ctx.lineTo(5, -23);
          ctx.stroke();

          // Tank
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.ellipse(0, -20, 7.5, 5, 0, 0, Math.PI * 2);
          ctx.fill();

          // Headlight
          ctx.fillStyle = '#f8f9fa';
          ctx.beginPath();
          ctx.arc(0, -23, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#adb5bd';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Handlebars
          ctx.strokeStyle = '#dee2e6';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-15, -28);
          ctx.lineTo(-4, -25);
          ctx.lineTo(4, -25);
          ctx.lineTo(15, -28);
          ctx.stroke();

          // Mirrors
          ctx.fillStyle = '#adb5bd';
          ctx.beginPath();
          ctx.arc(-15, -30, 2, 0, Math.PI * 2);
          ctx.arc(15, -30, 2, 0, Math.PI * 2);
          ctx.fill();

          // Stand
          ctx.strokeStyle = '#343a40';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-4, -3);
          ctx.lineTo(-10, 0);
          ctx.stroke();
        } else {
          // Rear Tire
          ctx.fillStyle = '#111';
          ctx.fillRect(-5, -16, 10, 16);
          ctx.strokeStyle = '#333';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, -15);
          ctx.lineTo(0, -1);
          ctx.stroke();

          // Fender
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.ellipse(0, -15, 6.5, 4, 0, 0, Math.PI);
          ctx.fill();

          // Taillight
          ctx.fillStyle = '#d90429';
          ctx.fillRect(-2.5, -18, 5, 2.5);
          ctx.fillStyle = '#f8f9fa';
          ctx.fillRect(-3, -14, 6, 4);

          // Exhausts
          ctx.fillStyle = '#ced4da';
          ctx.beginPath();
          ctx.arc(-8, -4, 2.5, 0, Math.PI * 2);
          ctx.arc(8, -4, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#212529';
          ctx.beginPath();
          ctx.arc(-8, -4, 1.2, 0, Math.PI * 2);
          ctx.arc(8, -4, 1.2, 0, Math.PI * 2);
          ctx.fill();

          // Seat & Bars
          ctx.fillStyle = '#1a1a1a';
          ctx.beginPath();
          ctx.ellipse(0, -21, 5.5, 3, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#dee2e6';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-14, -30);
          ctx.lineTo(-4, -26);
          ctx.lineTo(4, -26);
          ctx.lineTo(14, -30);
          ctx.stroke();

          ctx.strokeStyle = '#343a40';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(4, -3);
          ctx.lineTo(10, 0);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    // --- Tent Obstacle (A-Frames + Blue Dome Tent) ---
    class Tent {
      constructor() {
        this.isDome = Math.random() < 0.35;
        
        if (this.isDome) {
          this.color = '#0077b6';
          this.width = 68 + Math.floor(Math.random() * 14);
          this.height = 36 + Math.floor(Math.random() * 6);
        } else {
          const regularColors = ['#283618', '#bc6c25', '#dda15e', '#d00000'];
          this.color = regularColors[Math.floor(Math.random() * regularColors.length)];
          this.width = 46 + Math.floor(Math.random() * 16);
          this.height = 36 + Math.floor(Math.random() * 10);
        }

        this.x = canvas.width + 50;
        this.y = GROUND_Y;
      }

      update() {
        this.x -= gameSpeed;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.isDome) {
          // Rounded Blue Dome Tent
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(this.width * 0.08, -this.height * 0.95, this.width * 0.92, -this.height * 0.95, this.width, 0);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#023e8a';
          ctx.beginPath();
          ctx.rect(2, -4, this.width - 4, 4);
          ctx.fill();

          ctx.strokeStyle = '#caf0f8';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(4, 0);
          ctx.quadraticCurveTo(this.width * 0.45, -this.height * 1.05, this.width - 6, 0);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(this.width - 4, 0);
          ctx.quadraticCurveTo(this.width * 0.55, -this.height * 1.05, 6, 0);
          ctx.stroke();

          ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
          ctx.beginPath();
          ctx.moveTo(this.width * 0.3, 0);
          ctx.quadraticCurveTo(this.width * 0.5, -this.height * 0.65, this.width * 0.7, 0);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#90e0ef';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(this.width * 0.3, 0);
          ctx.quadraticCurveTo(this.width * 0.5, -this.height * 0.65, this.width * 0.7, 0);
          ctx.stroke();

          ctx.strokeStyle = '#adb5bd';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(0, 0); ctx.lineTo(-4, 2);
          ctx.moveTo(this.width, 0); ctx.lineTo(this.width + 4, 2);
          ctx.stroke();
        } else {
          // A-Frame Tent
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(this.width / 2, -this.height);
          ctx.lineTo(this.width, 0);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
          ctx.beginPath();
          ctx.moveTo(this.width / 2, -this.height);
          ctx.lineTo(this.width / 2, 0);
          ctx.lineTo(this.width * 0.75, 0);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#faedcd';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(this.width / 2, -this.height);
          ctx.lineTo(this.width * 0.28, 0);
          ctx.stroke();

          ctx.strokeStyle = '#e9d8a6';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(this.width / 2, -this.height);
          ctx.lineTo(-7, 0);
          ctx.moveTo(this.width / 2, -this.height);
          ctx.lineTo(this.width + 7, 0);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    // --- Foreground Ducks ---
    class Duck {
      constructor() {
        this.x = canvas.width + Math.random() * 80;
        this.y = 265 + Math.random() * 20;
        this.bob = Math.random() * Math.PI * 2;
      }

      update() {
        this.x -= gameSpeed * 1.05;
        this.bob += 0.15;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y + Math.sin(this.bob) * 1.5);

        ctx.fillStyle = '#606c38';
        ctx.beginPath();
        ctx.ellipse(0, 0, 9, 6, 0.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#2d6a4f';
        ctx.beginPath();
        ctx.arc(-7, -4, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(-7, -2, 4.5, 0.2, Math.PI * 0.8);
        ctx.stroke();

        ctx.fillStyle = '#f77f00';
        ctx.beginPath();
        ctx.moveTo(-11, -4);
        ctx.lineTo(-15, -3);
        ctx.lineTo(-11, -2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-8, -5, 1, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // --- Soft Clouds ---
    class Cloud {
      constructor() {
        this.x = canvas.width + Math.random() * 150;
        this.y = 20 + Math.random() * 55;
        this.speed = 0.4 + Math.random() * 0.4;
        this.scale = 0.7 + Math.random() * 0.6;
      }
      update() {
        this.x -= this.speed;
      }
      draw() {
        ctx.fillStyle = 'rgba(230, 240, 250, 0.75)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 18 * this.scale, 0, Math.PI * 2);
        ctx.arc(this.x + 15 * this.scale, this.y - 7 * this.scale, 22 * this.scale, 0, Math.PI * 2);
        ctx.arc(this.x + 32 * this.scale, this.y, 16 * this.scale, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function resetGame() {
      obstacles = [];
      clouds = [];
      ducks = [];
      parkedBikes = [];
      rider.y = GROUND_Y;
      rider.vy = 0;
      rider.isGrounded = true;
      score = 0;
      gameSpeed = 5;
      nextObstacleTimer = 0;
      nextParkedBikeTimer = 40;
      gameOver = false;
    }

    function checkCollision(r, t) {
      const rBox = {
        left: r.x - 8,
        right: r.x + 58,
        top: r.y - 40,
        bottom: r.y
      };

      const tBox = {
        left: t.x + 8,
        right: t.x + t.width - 8,
        top: t.y - t.height + 6,
        bottom: t.y
      };

      return (
        rBox.right > tBox.left &&
        rBox.left < tBox.right &&
        rBox.bottom > tBox.top &&
        rBox.top < tBox.bottom
      );
    }

    function drawValleyScene() {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 150);
      skyGrad.addColorStop(0, '#537d99');
      skyGrad.addColorStop(0.65, '#87afc7');
      skyGrad.addColorStop(1, '#b0cdd9');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      clouds.forEach((cloud, index) => {
        cloud.update();
        cloud.draw();
        if (cloud.x < -100) clouds.splice(index, 1);
      });

      // Distant Sunlit Fells
      ctx.fillStyle = '#b5b879';
      ctx.beginPath();
      ctx.moveTo(250, 150);
      ctx.quadraticCurveTo(450, 75, 700, 150);
      ctx.lineTo(canvas.width, 150);
      ctx.lineTo(250, 150);
      ctx.fill();

      // Hill shadow patch
      ctx.fillStyle = '#8a945d';
      ctx.beginPath();
      ctx.moveTo(430, 105);
      ctx.quadraticCurveTo(520, 110, 600, 150);
      ctx.lineTo(440, 150);
      ctx.fill();

      // Forest Ridges
      ctx.fillStyle = '#2d5a27';
      ctx.beginPath();
      ctx.moveTo(0, 175);
      for (let x = 0; x <= canvas.width; x += 35) {
        const peakY = 110 + Math.sin(x * 0.015) * 25 + Math.cos(x * 0.04) * 10;
        ctx.lineTo(x, peakY);
      }
      ctx.lineTo(canvas.width, 185);
      ctx.lineTo(0, 185);
      ctx.fill();

      ctx.fillStyle = '#1e3f20';
      ctx.beginPath();
      ctx.moveTo(0, 185);
      for (let x = 0; x <= canvas.width; x += 25) {
        ctx.lineTo(x, 140 + Math.sin(x * 0.03) * 12);
      }
      ctx.lineTo(canvas.width, 195);
      ctx.lineTo(0, 195);
      ctx.fill();

      // Autumn Yellow Bush
      ctx.fillStyle = '#e9b310';
      ctx.beginPath();
      ctx.arc(740, 160, 14, 0, Math.PI * 2);
      ctx.arc(752, 165, 11, 0, Math.PI * 2);
      ctx.fill();

      // River
      const riverGrad = ctx.createLinearGradient(0, 175, 0, 230);
      riverGrad.addColorStop(0, '#5b7682');
      riverGrad.addColorStop(0.5, '#415a6b');
      riverGrad.addColorStop(1, '#2f4350');
      ctx.fillStyle = riverGrad;
      ctx.fillRect(0, 175, canvas.width, 55);

      // Pebble Shoal
      ctx.fillStyle = '#9b8e78';
      ctx.beginPath();
      ctx.ellipse(320, 192, 130, 9, -0.05, 0, Math.PI * 2);
      ctx.fill();

      riverOffset = (riverOffset + gameSpeed * 0.35) % 80;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 1.5;
      for (let rx = -80; rx < canvas.width + 80; rx += 90) {
        ctx.beginPath();
        ctx.moveTo(rx - riverOffset, 186);
        ctx.lineTo(rx - riverOffset + 35, 186);
        ctx.moveTo(rx - riverOffset + 40, 212);
        ctx.lineTo(rx - riverOffset + 85, 212);
        ctx.stroke();
      }

      // Meadow Foreground
      const grassGrad = ctx.createLinearGradient(0, 225, 0, canvas.height);
      grassGrad.addColorStop(0, '#588157');
      grassGrad.addColorStop(0.3, '#3a5a40');
      grassGrad.addColorStop(1, '#1b321e');
      ctx.fillStyle = grassGrad;
      ctx.fillRect(0, 225, canvas.width, canvas.height - 225);

      grassOffset = (grassOffset + gameSpeed) % 20;
      ctx.strokeStyle = '#a3b18a';
      ctx.lineWidth = 2;
      for (let gx = -20; gx < canvas.width + 20; gx += 16) {
        ctx.beginPath();
        ctx.moveTo(gx - grassOffset, 248);
        ctx.lineTo(gx - grassOffset + 4, 237);
        ctx.stroke();
      }
    }

    // --- Main Game Loop ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.015) clouds.push(new Cloud());

      if (Math.random() < 0.008 && ducks.length < 3) {
        ducks.push(new Duck());
      }

      drawValleyScene();

      if (!gameOver) {
        score++;
        if (score % 250 === 0) gameSpeed += 0.35;

        rider.update();

        // 1. Background Parked Bikes
        nextParkedBikeTimer--;
        if (nextParkedBikeTimer <= 0) {
          parkedBikes.push(new ParkedBike());
          nextParkedBikeTimer = Math.floor(90 + Math.random() * 110);
        }

        for (let b = parkedBikes.length - 1; b >= 0; b--) {
          parkedBikes[b].update();
          if (parkedBikes[b].x < -40) parkedBikes.splice(b, 1);
        }

        // 2. Obstacles (Tents)
        nextObstacleTimer--;
        if (nextObstacleTimer <= 0) {
          obstacles.push(new Tent());
          nextObstacleTimer = Math.floor(75 + Math.random() * 60 - (gameSpeed * 2));
          if (nextObstacleTimer < 45) nextObstacleTimer = 45;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const tent = obstacles[i];
          tent.update();

          if (checkCollision(rider, tent)) {
            gameOver = true;
            playCrashSound();
            if (score > highScore) highScore = score;
          }

          if (tent.x + tent.width < -40) {
            obstacles.splice(i, 1);
          }
        }

        // 3. Foreground Ducks
        for (let d = ducks.length - 1; d >= 0; d--) {
          ducks[d].update();
          if (ducks[d].x < -30) ducks.splice(d, 1);
        }
      }

      // Render layers
      parkedBikes.forEach(bike => bike.draw());
      obstacles.forEach(tent => tent.draw());
      rider.draw();
      ducks.forEach(duck => duck.draw());

      // UI / HUD
      ctx.fillStyle = '#f8f9fa';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 4;
      ctx.font = 'bold 15px monospace';
      ctx.fillText(`SCORE: ${Math.floor(score)}`, canvas.width - 140, 26);
      ctx.fillText(`HI: ${Math.floor(highScore)}`, canvas.width - 230, 26);
      ctx.shadowBlur = 0;

      // Crash Screen
      if (gameOver) {
        ctx.fillStyle = 'rgba(10, 20, 15, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff4d6d';
        ctx.font = 'bold 34px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('WIPED OUT!', canvas.width / 2, canvas.height / 2 - 10);

        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText('Press SPACE or TAP to Ride Again', canvas.width / 2, canvas.height / 2 + 30);
        ctx.textAlign = 'left';
      }

      requestAnimationFrame(loop);
    }

    // --- Action Handler ---
    function triggerAction() {
      initAudio();
      if (gameOver) {
        resetGame();
      } else {
        rider.jump();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        triggerAction();
      }
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.id === 'mute-btn') return;
      e.preventDefault();
      triggerAction();
    });

    loop();
  </script>
</body>
</html>
