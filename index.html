<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🤘Party's😎BS🤪👀rideouts🍻🏍</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 10px; background: #141b17; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    h1 {
      margin: 0 0 10px; font-size: clamp(16px, 4.5vw, 22px);
      letter-spacing: 1px; color: #70e000;
      text-shadow: 0 2px 8px rgba(0,0,0,.8); text-align: center;
      /* NO text-transform: uppercase to protect emoji byte sequences */
      font-family: system-ui, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif;
    }
    #game-container {
      position: relative; border: 3px solid #38b000; border-radius: 12px;
      overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.7); background: #2b3a4a;
      width: 100%; max-width: 800px; touch-action: manipulation;
    }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 800 / 300; }
    #mute-btn {
      position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.6);
      border: 1px solid #70e000; color: #fff; padding: 6px; border-radius: 6px;
      cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px;
    }
    #mute-btn svg { width: 18px; height: 18px; fill: #fff; }
    .instructions { margin-top: 15px; color: #99a89c; font-size: 14px; text-align: center; }
    .instructions kbd {
      background: #2b3a4a; padding: 3px 7px; border-radius: 4px;
      border: 1px solid #4a5c6e; color: #fff;
    }
  </style>
</head>
<body>
  <!-- Encoded with Unicode HTML entities so mobile copy/paste can never corrupt them -->
  <h1>&#x1F918;Party's&#x1F60E;BS&#x1F92A;&#x1F440;rideouts&#x1F37B;&#x1F3CD;</h1>
  <div id="game-container">
    <button id="mute-btn" title="Toggle Sound" aria-label="Toggle Sound">
      <svg id="sound-icon" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
    </button>
    <canvas id="gameCanvas" width="800" height="300"></canvas>
  </div>
  <p class="instructions">Press <kbd>Space</kbd>, <kbd>↑</kbd>, or <b>Tap</b> to Jump / Restart</p>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const muteBtn = document.getElementById('mute-btn');
    const soundIcon = document.getElementById('sound-icon');

    const GY = 245, GRAV = 0.65, JUMP = -13;
    let speed = 5, score = 0, hiScore = 0, gameOver = false;
    let obstacles = [], clouds = [], ducks = [], parkedBikes = [];
    let obsTimer = 0, bikeTimer = 40, riverOff = 0, grassOff = 0;

    // --- Drawing Utilities ---
    function circ(x, y, r, fill, stroke) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
    }
    function line(x1, y1, x2, y2, stroke, w = 1) {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.strokeStyle = stroke; ctx.lineWidth = w; ctx.stroke();
    }

    // --- Audio Engine ---
    let actx = null, isMuted = false, mStep = 0, noiseBuf = null;
    const bassRiff = [82.4, 82.4, 98, 82.4, 110, 82.4, 98, 82.4, 82.4, 82.4, 146.8, 110, 98, 82.4, 73.4, 82.4];
    const chords = [
      [164.8, 246.9], 0, [196, 293.7], 0, [220, 329.6], 0, [196, 293.7], 0,
      [164.8, 246.9], 0, [293.7, 440], [220, 329.6], [196, 293.7], 0, [146.8, 220], 0
    ];

    function initAudio() {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
        const out = noiseBuf.getChannelData(0);
        for (let i = 0; i < actx.sampleRate; i++) out[i] = Math.random() * 2 - 1;
        setInterval(playRockStep, 115);
      }
      if (actx.state === 'suspended') actx.resume();
    }

    function playTone(freq, type, dur, gainVal, endFreq) {
      if (!actx || isMuted) return;
      const t = actx.currentTime, osc = actx.createOscillator(), g = actx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      g.gain.setValueAtTime(gainVal, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t); osc.stop(t + dur);
    }

    function playNoise(dur, gainVal, hpFreq) {
      if (!actx || isMuted || !noiseBuf) return;
      const t = actx.currentTime, src = actx.createBufferSource(), filter = actx.createBiquadFilter(), g = actx.createGain();
      src.buffer = noiseBuf; src.loop = true;
      filter.type = 'highpass'; filter.frequency.value = hpFreq;
      g.gain.setValueAtTime(gainVal, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(filter); filter.connect(g); g.connect(actx.destination);
      src.start(t); src.stop(t + dur);
    }

    function playRockStep() {
      if (!actx || isMuted || gameOver) return;
      const step = mStep % 16;
      playTone(bassRiff[step], 'sawtooth', 0.1, 0.18);
      if (chords[step]) chords[step].forEach(f => playTone(f, 'square', 0.16, 0.08));
      if (step % 4 === 0 || step === 10) playTone(140, 'sine', 0.1, 0.35, 32);
      if (step === 4 || step === 12) playNoise(0.12, 0.22, 900);
      playNoise(0.04, step % 2 ? 0.04 : 0.08, 6500);
      mStep++;
    }

    muteBtn.onclick = (e) => {
      e.stopPropagation(); initAudio();
      isMuted = !isMuted;
      soundIcon.innerHTML = isMuted
        ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
        : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    };

    // --- Player Rider Object ---
    const rider = {
      x: 75, y: GY, vy: 0, grounded: true, rot: 0,
      jump() {
        if (this.grounded) {
          this.vy = JUMP; this.grounded = false;
          playTone(140, 'sawtooth', 0.18, 0.2, 320);
        }
      },
      update() {
        this.vy += GRAV; this.y += this.vy;
        if (this.y >= GY) { this.y = GY; this.vy = 0; this.grounded = true; }
        if (this.grounded) this.rot += 0.25;
      },
      drawWheel(wx, wy) {
        ctx.save(); ctx.translate(wx, wy); ctx.rotate(this.rot);
        circ(0, 0, 10, '#1b1b1b'); circ(0, 0, 4, '#ced4da');
        ctx.strokeStyle = '#ced4da'; ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
          ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
          ctx.rotate(Math.PI / 4);
        }
        ctx.restore();
      },
      draw() {
        ctx.save(); ctx.translate(this.x, this.y);
        if (!this.grounded) ctx.rotate(-0.08);

        this.drawWheel(0, 0); this.drawWheel(55, 0);

        ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 3; ctx.lineCap = ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(20, -5); ctx.lineTo(25, -20); ctx.lineTo(10, -15); ctx.closePath(); ctx.stroke();
        ctx.fillStyle = '#6c757d'; ctx.fillRect(16, -14, 10, 10);

        ctx.fillStyle = '#d90429'; ctx.beginPath(); ctx.ellipse(28, -20, 10, 5, -0.2, 0, Math.PI * 2); ctx.fill();
        line(55, 0, 34, -22, '#dee2e6', 3); line(34, -22, 31, -38, '#dee2e6', 2.5);
        line(22, -6, 2, -4, '#e9ecef', 2.5); line(2, -4, -6, -8, '#e9ecef', 2.5);

        line(14, -16, 20, -32, '#212529', 6); line(20, -30, 31, -36, '#212529', 3.5);
        circ(22, -38, 7, '#343a40'); ctx.fillStyle = '#ffbe0b'; ctx.fillRect(25, -40, 4, 3);
        ctx.restore();
      }
    };

    // --- Scenery Entities ---
    class ParkedBike {
      constructor() {
        this.x = canvas.width + 30; this.y = 236;
        this.facing = Math.random() < 0.5;
        this.color = ['#e63946', '#fca311', '#457b9d', '#9b5de5', '#2a9d8f'][Math.floor(Math.random() * 5)];
        this.lean = (Math.random() * 0.08) - 0.04;
      }
      draw() {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.lean);
        if (this.facing) {
          ctx.fillStyle = '#111'; ctx.fillRect(-3.5, -16, 7, 16);
          line(0, -14, 0, -2, '#adb5bd', 1.5);
          line(-5, -3, -5, -23, '#ced4da', 2); line(5, -3, 5, -23, '#ced4da', 2);
          ctx.fillStyle = this.color; ctx.beginPath(); ctx.ellipse(0, -20, 7.5, 5, 0, 0, Math.PI * 2); ctx.fill();
          circ(0, -23, 4, '#f8f9fa', '#adb5bd');
          line(-15, -28, 15, -28, '#dee2e6', 2); line(-4, -3, -10, 0, '#343a40', 2);
        } else {
          ctx.fillStyle = '#111'; ctx.fillRect(-5, -16, 10, 16);
          ctx.fillStyle = this.color; ctx.beginPath(); ctx.ellipse(0, -15, 6.5, 4, 0, 0, Math.PI); ctx.fill();
          ctx.fillStyle = '#d90429'; ctx.fillRect(-2.5, -18, 5, 2.5);
          circ(-8, -4, 2.5, '#ced4da'); circ(8, -4, 2.5, '#ced4da');
          line(-14, -30, 14, -30, '#dee2e6', 2); line(4, -3, 10, 0, '#343a40', 2);
        }
        ctx.restore();
      }
    }

    class Tent {
      constructor(off = 0) {
        this.isDome = Math.random() < 0.35;
        this.color = this.isDome ? '#0077b6' : ['#283618', '#bc6c25', '#dda15e', '#d00000'][Math.floor(Math.random() * 4)];
        this.width = (this.isDome ? 62 : 44) + Math.floor(Math.random() * 12);
        this.height = 36 + Math.floor(Math.random() * 8);
        this.x = canvas.width + 50 + off;
      }
      draw() {
        ctx.save(); ctx.translate(this.x, GY);
        ctx.fillStyle = this.color; ctx.beginPath();
        if (this.isDome) {
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(this.width * 0.08, -this.height * 0.95, this.width * 0.92, -this.height * 0.95, this.width, 0);
          ctx.fill();
          ctx.fillStyle = '#023e8a'; ctx.fillRect(2, -4, this.width - 4, 4);
          ctx.strokeStyle = '#caf0f8'; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(4, 0); ctx.quadraticCurveTo(this.width * 0.45, -this.height * 1.05, this.width - 6, 0); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(this.width - 4, 0); ctx.quadraticCurveTo(this.width * 0.55, -this.height * 1.05, 6, 0); ctx.stroke();
          ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath();
          ctx.moveTo(this.width * 0.3, 0); ctx.quadraticCurveTo(this.width * 0.5, -this.height * 0.65, this.width * 0.7, 0); ctx.fill();
        } else {
          ctx.moveTo(0, 0); ctx.lineTo(this.width / 2, -this.height); ctx.lineTo(this.width, 0); ctx.fill();
          ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath();
          ctx.moveTo(this.width / 2, -this.height); ctx.lineTo(this.width / 2, 0); ctx.lineTo(this.width * 0.75, 0); ctx.fill();
          line(this.width / 2, -this.height, this.width * 0.28, 0, '#faedcd', 1.5);
          line(this.width / 2, -this.height, -7, 0, '#e9d8a6'); line(this.width / 2, -this.height, this.width + 7, 0, '#e9d8a6');
        }
        ctx.restore();
      }
    }

    class Duck {
      constructor() {
        this.x = canvas.width + Math.random() * 80; this.y = 265 + Math.random() * 20; this.b = 0;
      }
      draw() {
        ctx.save(); ctx.translate(this.x, this.y + Math.sin(this.b) * 1.5);
        ctx.fillStyle = '#606c38'; ctx.beginPath(); ctx.ellipse(0, 0, 9, 6, 0.1, 0, Math.PI * 2); ctx.fill();
        circ(-7, -4, 4.5, '#2d6a4f');
        ctx.fillStyle = '#f77f00'; ctx.beginPath(); ctx.moveTo(-11, -4); ctx.lineTo(-15, -3); ctx.lineTo(-11, -2); ctx.fill();
        circ(-8, -5, 1, '#000');
        ctx.restore();
      }
    }

    class Cloud {
      constructor() {
        this.x = canvas.width + Math.random() * 150; this.y = 20 + Math.random() * 55;
        this.spd = 0.4 + Math.random() * 0.4; this.s = 0.7 + Math.random() * 0.6;
      }
      draw() {
        ctx.fillStyle = 'rgba(230, 240, 250, 0.75)';
        circ(this.x, this.y, 18 * this.s); circ(this.x + 15 * this.s, this.y - 7 * this.s, 22 * this.s); circ(this.x + 32 * this.s, this.y, 16 * this.s);
      }
    }

    function spawnCluster() {
      const max = score > 2000 ? 3 : (score >= 500 ? 2 : 1);
      const count = Math.floor(Math.random() * max) + 1;
      let offset = 0;
      for (let i = 0; i < count; i++) {
        const t = new Tent(offset);
        obstacles.push(t);
        offset += t.width + (Math.random() * 8 + 4);
      }
      obsTimer = Math.max(48, Math.floor(70 + count * 24 + Math.random() * 45 - speed * 1.5));
    }

    function resetGame() {
      obstacles = []; clouds = []; ducks = []; parkedBikes = [];
      rider.y = GY; rider.vy = 0; rider.grounded = true;
      score = 0; speed = 5; obsTimer = 0; bikeTimer = 40; gameOver = false;
    }

    function checkCollision(r, t) {
      return (r.x + 58 > t.x + 8 && r.x - 8 < t.x + t.width - 8 && r.y > GY - t.height + 6 && r.y - 40 < GY);
    }

    function drawValley() {
      const sky = ctx.createLinearGradient(0, 0, 0, 150);
      sky.addColorStop(0, '#537d99'); sky.addColorStop(1, '#b0cdd9');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = clouds.length - 1; i >= 0; i--) {
        clouds[i].x -= clouds[i].spd; clouds[i].draw();
        if (clouds[i].x < -100) clouds.splice(i, 1);
      }

      ctx.fillStyle = '#b5b879'; ctx.beginPath();
      ctx.moveTo(250, 150); ctx.quadraticCurveTo(450, 75, 700, 150); ctx.lineTo(canvas.width, 150); ctx.lineTo(250, 150); ctx.fill();
      ctx.fillStyle = '#8a945d'; ctx.beginPath();
      ctx.moveTo(430, 105); ctx.quadraticCurveTo(520, 110, 600, 150); ctx.lineTo(440, 150); ctx.fill();

      ctx.fillStyle = '#2d5a27'; ctx.beginPath(); ctx.moveTo(0, 175);
      for (let x = 0; x <= canvas.width; x += 35) ctx.lineTo(x, 110 + Math.sin(x * 0.015) * 25);
      ctx.lineTo(canvas.width, 185); ctx.lineTo(0, 185); ctx.fill();

      ctx.fillStyle = '#1e3f20'; ctx.beginPath(); ctx.moveTo(0, 185);
      for (let x = 0; x <= canvas.width; x += 25) ctx.lineTo(x, 140 + Math.sin(x * 0.03) * 12);
      ctx.lineTo(canvas.width, 195); ctx.lineTo(0, 195); ctx.fill();

      circ(740, 160, 14, '#e9b310');

      const river = ctx.createLinearGradient(0, 175, 0, 230);
      river.addColorStop(0, '#5b7682'); river.addColorStop(1, '#2f4350');
      ctx.fillStyle = river; ctx.fillRect(0, 175, canvas.width, 55);

      ctx.fillStyle = '#9b8e78'; ctx.beginPath(); ctx.ellipse(320, 192, 130, 9, -0.05, 0, Math.PI * 2); ctx.fill();

      riverOff = (riverOff + speed * 0.35) % 80;
      for (let rx = -80; rx < canvas.width + 80; rx += 90) {
        line(rx - riverOff, 186, rx - riverOff + 35, 186, 'rgba(255,255,255,0.35)', 1.5);
        line(rx - riverOff + 40, 212, rx - riverOff + 85, 212, 'rgba(255,255,255,0.35)', 1.5);
      }

      const grass = ctx.createLinearGradient(0, 225, 0, canvas.height);
      grass.addColorStop(0, '#588157'); grass.addColorStop(1, '#1b321e');
      ctx.fillStyle = grass; ctx.fillRect(0, 225, canvas.width, canvas.height - 225);

      grassOff = (grassOff + speed) % 20;
      for (let gx = -20; gx < canvas.width + 20; gx += 16) line(gx - grassOff, 248, gx - grassOff + 4, 237, '#a3b18a', 2);
    }

    // --- Main Loop ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.015) clouds.push(new Cloud());
      if (Math.random() < 0.008 && ducks.length < 3) ducks.push(new Duck());

      drawValley();

      if (!gameOver) {
        score++;
        if (score % 220 === 0) speed += 0.35;
        rider.update();

        if (--bikeTimer <= 0) {
          parkedBikes.push(new ParkedBike());
          bikeTimer = Math.floor(90 + Math.random() * 110);
        }

        if (--obsTimer <= 0) spawnCluster();
      }

      for (let i = parkedBikes.length - 1; i >= 0; i--) {
        if (!gameOver) parkedBikes[i].x -= speed;
        parkedBikes[i].draw();
        if (parkedBikes[i].x < -40) parkedBikes.splice(i, 1);
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const t = obstacles[i];
        if (!gameOver) {
          t.x -= speed;
          if (checkCollision(rider, t)) {
            gameOver = true;
            playNoise(0.5, 0.5, 200);
            if (score > hiScore) hiScore = score;
          }
        }
        t.draw();
        if (t.x + t.width < -40) obstacles.splice(i, 1);
      }

      rider.draw();

      for (let i = ducks.length - 1; i >= 0; i--) {
        const d = ducks[i];
        if (!gameOver) { d.x -= speed * 1.05; d.b += 0.15; }
        d.draw();
        if (d.x < -30) ducks.splice(i, 1);
      }

      ctx.fillStyle = '#f8f9fa'; ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
      ctx.font = 'bold 15px monospace';
      ctx.fillText(`SCORE: ${score}`, canvas.width - 140, 26);
      ctx.fillText(`HI: ${hiScore}`, canvas.width - 230, 26);
      ctx.shadowBlur = 0;

      if (gameOver) {
        ctx.fillStyle = 'rgba(10, 20, 15, 0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff4d6d'; ctx.font = 'bold 34px monospace'; ctx.textAlign = 'center';
        ctx.fillText('WIPED OUT!', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
        ctx.fillText('Press SPACE or TAP to Ride Again', canvas.width / 2, canvas.height / 2 + 30);
        ctx.textAlign = 'left';
      }

      requestAnimationFrame(loop);
    }

    function triggerAction() {
      initAudio();
      if (gameOver) resetGame();
      else rider.jump();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); triggerAction(); }
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#mute-btn')) return;
      e.preventDefault(); triggerAction();
    });

    loop();
  </script>
</body>
</html>
